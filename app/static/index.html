<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CD Wishlist</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Ccircle cx='17' cy='17' r='15' fill='%231C1B19'/%3E%3Ccircle cx='17' cy='17' r='5' fill='none' stroke='%2350B5AE' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="17" r="5" fill="none" stroke="#50B5AE" stroke-width="2"/><path d="M9 11a10 10 0 0 1 6-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span>CD Wishlist</span>
  </div>
  <div class="search">
    <label for="q" class="sr">Zoeken</label>
    <input id="q" type="search" placeholder="Zoek op band of album…" autocomplete="off">
  </div>
  <div class="actions">
    <button type="button" class="btn ghost" id="btnImport">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
      Importeer
    </button>
    <a class="btn ghost" href="api/export" download>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 19h16"/></svg>
      Exporteer
    </a>
    <button type="button" class="btn primary" id="btnAdd">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Album toevoegen
    </button>
  </div>
</header>

<div class="layout">
  <nav class="filters" aria-label="Filters">
    <section>
      <h2>Status</h2>
      <div id="statusList"></div>
    </section>
    <section>
      <h2>Bands</h2>
      <div id="bandList" class="bandlist"></div>
    </section>
  </nav>

  <main class="content">
    <div class="titlebar">
      <h1 id="title">Wishlist</h1>
      <div class="sort">
        <label for="sort">Sorteer op</label>
        <select id="sort">
          <option value="band">Band</option>
          <option value="jaar">Jaar</option>
          <option value="album">Album</option>
          <option value="prijs">Prijs</option>
          <option value="recent">Laatst gewijzigd</option>
        </select>
      </div>
    </div>
    <p class="stats" id="stats"></p>
    <div class="tablewrap">
      <table>
        <thead>
          <tr><th>Album</th><th>Jaar</th><th>Prijs</th><th>Status</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty" id="empty" hidden>Geen albums gevonden.</p>
    </div>
  </main>

  <aside class="detail" id="detail" aria-label="Details">
    <p class="placeholder">Kies een album om het te bekijken of te bewerken.</p>
  </aside>
</div>

<dialog id="importDlg">
  <form method="dialog" id="importForm">
    <h2>Excel importeren</h2>
    <p class="muted">Eerste rij met kolomnamen: <b>Band</b>, <b>Album</b>, en optioneel Year/Jaar, Prijs en een statuskolom ("Check" = in bezit).</p>
    <label class="field">Bestand
      <input type="file" name="file" accept=".xlsx" required>
    </label>
    <fieldset class="radios">
      <legend>Bestaande albums</legend>
      <label><input type="radio" name="mode" value="merge" checked> Samenvoegen (bijwerken op band + album)</label>
      <label><input type="radio" name="mode" value="replace"> Alles vervangen</label>
    </fieldset>
    <p id="importMsg" class="muted" role="status"></p>
    <div class="row-end">
      <button type="button" class="btn light" id="importCancel">Sluiten</button>
      <button type="submit" class="btn primary" id="importGo" value="go">Importeren</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
